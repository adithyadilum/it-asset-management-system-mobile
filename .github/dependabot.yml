version: 2
updates:
  # The audit baseline exists because the Expo toolchain carries advisories that
  # only an SDK upgrade clears. Dependabot is what surfaces those upgrades.
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
